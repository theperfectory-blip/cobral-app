// ==================== ACTUALIZADOR (solo APK) ====================
// Mismo modelo que la app de TSC: la APK de cada version esta en GitHub Releases junto a update.json
// ({versionCode, versionName, apkUrl, sha256, notes}). Al abrir la app (y desde Configuracion) se compara versionCode con el
// instalado; si hay una mayor se ofrece actualizar. Descarga/instalacion: plugin nativo AppUpdater (AppUpdaterPlugin.java).
// La web NO usa esto (se actualiza sola al publicar). Los datos se conservan: se instala encima, con la misma firma.
let APP_VERSION_LABEL=(/Cobral v([\d.]+)/.exec(document.title)||[])[1]||'';
const UPDATE_MANIFEST_URL='https://github.com/theperfectory-blip/cobral-app/releases/latest/download/update.json';
function updaterPlugin(){try{return(isNative&&window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.AppUpdater)||null}catch(e){return null}}
function escHtml(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Puro dato: compara SIEMPRE por versionCode (numero), nunca por versionName. manifestUrl solo se usa en pruebas.
async function updaterCheck(manifestUrl){
const P=window.Capacitor&&window.Capacitor.Plugins;if(!updaterPlugin()||!P||!P.App)return{ok:false,reason:'no-disponible'};
let info;try{info=await P.App.getInfo()}catch(e){return{ok:false,reason:'app-info'}}
const cur=parseInt(info&&info.build,10);if(!Number.isFinite(cur))return{ok:false,reason:'app-info'};
const base={currentCode:cur,currentName:(info&&info.version)||null};
if(!P.CapacitorHttp)return{ok:false,reason:'sin-http',...base};
let res;try{res=await P.CapacitorHttp.request({url:manifestUrl||UPDATE_MANIFEST_URL,method:'GET'})}catch(e){return{ok:false,reason:'red',...base}}
const st=res&&res.status;if(!(typeof st==='number'&&st>=200&&st<300))return{ok:false,reason:'red',status:st,...base};
let m=res.data;if(typeof m==='string'){try{m=JSON.parse(m)}catch(e){return{ok:false,reason:'manifiesto',...base}}}
const rc=m&&parseInt(m.versionCode,10);if(!m||typeof m!=='object'||!Number.isFinite(rc))return{ok:false,reason:'manifiesto',...base};
return{ok:true,...base,remoteCode:rc,remoteName:m.versionName||null,apkUrl:m.apkUrl||null,sha256:m.sha256||null,notes:m.notes||'',hasUpdate:rc>cur&&!!m.apkUrl}}
function updaterRemember(code){try{localStorage.setItem('cobralUpdateDismissed',JSON.stringify({code,at:Date.now()}))}catch(e){}}
function updaterDismissedRecently(code){try{const d=JSON.parse(localStorage.getItem('cobralUpdateDismissed')||'null');return!!(d&&d.code===code&&Date.now()-d.at<24*3600*1000)}catch(e){return false}}
function openUpdateModal(u,msg){state.updateInfo=u;
document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this&&!state.updateBusy)closeModal()"><div class="modal"><div class="modal-header"><h2 class="modal-title">${SVG.download} Nueva versión disponible</h2><button class="modal-close" onclick="if(!state.updateBusy)closeModal()">×</button></div><div class="modal-body"><div style="text-align:center;margin-bottom:14px"><div style="font-size:22px;font-weight:700">Cobral ${escHtml(u.remoteName||u.remoteCode)}</div><div style="font-size:13px;color:var(--gray-500)">Tienes la ${escHtml(u.currentName||u.currentCode)}</div></div>${u.notes?`<div style="background:var(--gray-50);border-radius:var(--radius);padding:12px;font-size:14px;line-height:1.5;white-space:pre-wrap;margin-bottom:12px">${escHtml(u.notes)}</div>`:''}<p id="updateMsg" style="font-size:13px;color:var(--gray-500);text-align:center;margin:0">${msg||'Se instala encima de la actual: tus ventas, inventario y fotos se conservan.'}</p></div><div class="modal-footer"><button class="btn btn-outline" id="updateLaterBtn" ${state.updateBusy?'disabled':''} onclick="updaterRemember(${u.remoteCode});closeModal()">Más tarde</button><button class="btn btn-primary" id="updateGoBtn" ${state.updateBusy?'disabled':''} onclick="installUpdate()">${state.updateBusy?'Descargando…':'Actualizar'}</button></div></div></div>`}
async function installUpdate(){const u=state.updateInfo,P=updaterPlugin();if(!u||!P||state.updateBusy)return;
try{const g=await P.canInstall();if(!g||!g.granted){openUpdateModal(u,'Android necesita tu permiso para instalar la actualización. Toca Actualizar, activa «Permitir desde esta fuente» y vuelve a la app.');await P.openInstallPermissionSettings();return}}catch(e){}
state.updateBusy=true;openUpdateModal(u,'Descargando… cuando termine se abrirá el instalador de Android; toca «Actualizar» ahí. Si Play Protect pide analizar la app, elige «Más detalles» → «Instalar sin analizar».');
if(!state.updProgListener&&P.addListener){state.updProgListener=true;P.addListener('downloadProgress',e=>{if(!state.updateBusy)return;const b=document.getElementById('updateGoBtn');const t=e&&e.total>0?Math.min(100,Math.round(e.received*100/e.total)):null;if(b)b.textContent=t!==null?'Descargando '+t+'%':'Descargando…'})}
try{await P.downloadAndInstall({url:u.apkUrl,sha256:u.sha256||undefined});state.updateBusy=false;const m=document.getElementById('updateMsg');if(m)m.textContent='Listo. Confirma la instalación en la pantalla de Android. Si aparece «Análisis de app recomendado» (Play Protect), toca «Más detalles» y luego «Instalar sin analizar».';const b=document.getElementById('updateGoBtn');if(b){b.disabled=false;b.textContent='Actualizar'}const l=document.getElementById('updateLaterBtn');if(l)l.disabled=false}
catch(e){state.updateBusy=false;openUpdateModal(u,'No se pudo actualizar: '+escHtml((e&&e.message)||'error de descarga')+'. Puedes intentarlo de nuevo.')}}
async function updaterManual(){if(!updaterPlugin())return;showToast('Buscando actualización…','info');const u=await updaterCheck();
if(!u.ok){showToast(u.reason==='red'?'No se pudo comprobar: revisa tu conexión':'No se pudo comprobar la actualización','error');return}
if(u.hasUpdate){closeModal();openUpdateModal(u)}else showToast('Ya tienes la última versión ('+(u.currentName||u.currentCode)+')','success')}
let updaterBusyCheck=false;
async function updaterAuto(){if(!updaterPlugin()||updaterBusyCheck||state.updateBusy||!navigator.onLine)return;
try{const last=parseInt(localStorage.getItem('cobralUpdateLast')||'0',10);if(Date.now()-last<6*3600*1000)return}catch(e){}
if(document.querySelector('#modalContainer .modal-overlay')||saleOrEditInProgress())return;
updaterBusyCheck=true;try{const u=await updaterCheck();if(u.ok)try{localStorage.setItem('cobralUpdateLast',String(Date.now()))}catch(e){}
if(u.ok&&u.hasUpdate&&!updaterDismissedRecently(u.remoteCode)&&!document.querySelector('#modalContainer .modal-overlay')&&!saleOrEditInProgress())openUpdateModal(u)}finally{updaterBusyCheck=false}}
if(isNative){setTimeout(updaterAuto,6000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(updaterAuto,2500)})}
// ==================== FOTOS EN LA NUBE (Cloudinary) ====================
// Las fotos siguen guardandose en el telefono (IndexedDB) y todo funciona sin internet. Con cuenta + conexion cada foto se sube
// a Cloudinary (preset unsigned, como en tsc-web) y el producto guarda su enlace en p.imageUrl, que viaja con la sincronizacion.
// p.imageUrl: ausente = sin subir / desconocido; '' = foto eliminada a proposito; 'https://...' = foto en la nube.
// localStorage.cobralPhotoUrls {id:url} = que enlace corresponde a la foto que este dispositivo tiene guardada.
const PHOTO_MAP_KEY='cobralPhotoUrls';
function photoUrlMap(){try{return JSON.parse(localStorage.getItem(PHOTO_MAP_KEY)||'{}')||{}}catch(e){return{}}}
function savePhotoUrlMap(m){try{localStorage.setItem(PHOTO_MAP_KEY,JSON.stringify(m))}catch(e){}}
function forgetPhotoUrl(id){const m=photoUrlMap();delete m[String(id)];savePhotoUrlMap(m)}
function cloudinaryBase(){try{if(location.hostname==='localhost'){const b=localStorage.getItem('cobralCloudinaryBase');if(b)return b}}catch(e){}return'https://api.cloudinary.com'}
function cloudinaryOn(){const c=window.COBRAL_CLOUDINARY;return!!(c&&c.cloudName&&c.uploadPreset)&&!state.photoSyncOff}
async function cloudinaryUpload(dataUrl){const c=window.COBRAL_CLOUDINARY;const fd=new FormData();fd.append('file',dataUrl);fd.append('upload_preset',c.uploadPreset);fd.append('tags','cobral');const r=await fetch(cloudinaryBase()+'/v1_1/'+c.cloudName+'/image/upload',{method:'POST',body:fd});if(!r.ok){let m='';try{m=await r.text()}catch(e){}const e=new Error('upload '+r.status+' '+m.slice(0,160));e.status=r.status;e.body=m;throw e}const j=await r.json();if(!j||!j.secure_url)throw new Error('respuesta sin url');return j.secure_url}
function fetchPhotoAsDataUrl(url){return fetch(url).then(r=>{if(!r.ok)throw new Error('descarga '+r.status);return r.blob()}).then(b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)}))}
let photoSyncBusy=false,photoSyncAgain=false,photoSyncTimer=null;
function reconcilePhotosSoon(){clearTimeout(photoSyncTimer);photoSyncTimer=setTimeout(reconcilePhotos,1500)}
function photoSyncCounts(){const withLocal=state.products.filter(p=>state.photoCache[String(p.id)]);return{local:withLocal.length,up:withLocal.filter(p=>p.imageUrl).length}}
async function reconcilePhotos(){
if(!state.cloudUser||!cloudinaryOn()||!navigator.onLine)return;
if(photoSyncBusy){photoSyncAgain=true;return}
photoSyncBusy=true;let changedProducts=false,changedView=false;state.photoBad=state.photoBad||{};
try{
const todo=[],map0=photoUrlMap();
for(const p of state.products){const id=String(p.id),local=state.photoCache[id],url=p.imageUrl;
if(url===''){if(local||map0[id])todo.push({k:'drop',id})}
else if(!url){if(local&&!state.photoBad[id])todo.push({k:'up',id})}
else if(!local||map0[id]!==url)todo.push({k:'down',id,url})}
for(const t of todo){
const cur=()=>state.products.find(x=>String(x.id)===t.id);
try{
if(t.k==='up'){const data=state.photoCache[t.id];const url=await cloudinaryUpload(data);const p=cur();if(!p||state.photoCache[t.id]!==data||p.imageUrl!==undefined)continue;p.imageUrl=url;const m=photoUrlMap();m[t.id]=url;savePhotoUrlMap(m);changedProducts=true}
else if(t.k==='down'){const data=await fetchPhotoAsDataUrl(t.url);const p=cur();if(!p||p.imageUrl!==t.url)continue;await IDB.save(t.id,data);state.photoCache[t.id]=data;const m=photoUrlMap();m[t.id]=t.url;savePhotoUrlMap(m);changedView=true}
else{await IDB.del(t.id);delete state.photoCache[t.id];forgetPhotoUrl(t.id);changedView=true}
}catch(e){
const msg=String((e&&e.body)||(e&&e.message)||'');
if(t.k==='up'&&e&&[400,401,403,404].includes(e.status)&&/preset|cloud ?name|disabled|unauthorized|not found/i.test(msg)){state.photoSyncOff=true;console.log('Cloudinary no disponible (revisa el preset):',msg.slice(0,120));break}
if(t.k==='up'&&e&&e.status>=400&&e.status<500)state.photoBad[t.id]=true;
console.log('Foto '+t.id+':',msg.slice(0,120))}
if(!navigator.onLine)break;
if(document.getElementById('accountModalBody'))renderAccountModal()}
}finally{photoSyncBusy=false}
if(changedProducts)saveData();
if(changedView&&!document.querySelector('#modalContainer .modal-overlay')&&!state.cart.length&&!state.saleMinimized)render();
if(document.getElementById('accountModalBody'))renderAccountModal();
if(photoSyncAgain){photoSyncAgain=false;reconcilePhotosSoon()}}
window.addEventListener('online',reconcilePhotosSoon);

function flushPendingRemote(){if(!state.pendingRemote.length||saleOrEditInProgress())return;const q=state.pendingRemote;state.pendingRemote=[];q.forEach(applyRemoteChange);finishRemoteApply()}

}else{
body.innerHTML=`<div class="input-group"><label class="input-label">Correo</label><input class="input" id="cloudEmailInput" type="email" autocomplete="email" enterkeyhint="next" placeholder="tu@correo.com" value="${(state.cloudEmailDraft||'').replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('cloudPassInput').focus()}"></div><div class="input-group"><label class="input-label">Contraseña</label><input class="input" id="cloudPassInput" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="••••••••" onkeydown="if(event.key==='Enter'){event.preventDefault();cloudSignIn()}"></div>${state.cloudAuthError?`<div style="color:var(--danger);margin-bottom:10px;font-size:13px">${state.cloudAuthError}</div>`:''}<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn btn-primary" id="cloudSignInBtn" style="flex:1" ${state.cloudAuthBusy?'disabled':''} onclick="cloudSignIn()">Entrar</button><button class="btn btn-outline" id="cloudSignUpBtn" style="flex:1" ${state.cloudAuthBusy?'disabled':''} onclick="cloudSignUp()">Crear cuenta</button></div><div style="text-align:center;margin-bottom:16px"><a href="#" id="cloudResetLink" class="cloud-link" onclick="event.preventDefault();cloudResetPassword()">¿Olvidaste tu contraseña?</a></div><p style="font-size:12px;color:var(--gray-500);text-align:center;line-height:1.5">Tu cuenta sincroniza ventas, inventario y deudas entre tu celular y la versión web. Sin cuenta, Cobral sigue funcionando igual en este teléfono.</p>`;
}}

async function cloudSignIn(){const email=(document.getElementById('cloudEmailInput').value||'').trim();state.cloudEmailDraft=email;const pass=document.getElementById('cloudPassInput').value||'';if(!email||!pass){state.cloudAuthError='Ingresa correo y contraseña';return refreshCloudAuthUI()}state.cloudAuthBusy=true;state.cloudAuthError='';refreshCloudAuthUI();const r=await CobralCloud.signIn(email,pass);state.cloudAuthBusy=false;if(!r.ok){state.cloudAuthError=r.message;return refreshCloudAuthUI()}await finishCloudLogin()}
async function cloudSignUp(){const email=(document.getElementById('cloudEmailInput').value||'').trim();state.cloudEmailDraft=email;const pass=document.getElementById('cloudPassInput').value||'';if(!email||!pass){state.cloudAuthError='Ingresa correo y contraseña';return refreshCloudAuthUI()}state.cloudAuthBusy=true;state.cloudAuthError='';refreshCloudAuthUI();const r=await CobralCloud.signUp(email,pass);state.cloudAuthBusy=false;if(!r.ok){state.cloudAuthError=r.message;return refreshCloudAuthUI()}await finishCloudLogin()}
async function cloudResetPassword(){const email=(document.getElementById('cloudEmailInput').value||'').trim();state.cloudEmailDraft=email;if(!email){state.cloudAuthError='Ingresa tu correo para recuperar la contraseña';return refreshCloudAuthUI()}state.cloudAuthBusy=true;refreshCloudAuthUI();const r=await CobralCloud.resetPassword(email);state.cloudAuthBusy=false;state.cloudAuthError=r.ok?'':r.message;if(r.ok)showToast('Te enviamos un correo para recuperar tu contraseña','success');refreshCloudAuthUI()}
async function cloudSignOut(){if(!isNative){try{await CobralCloud.signOut({clearCache:true})}catch(e){console.log('Cloud sign out error:',e)}try{localStorage.removeItem('ventasApp');Object.keys(localStorage).filter(k=>k.indexOf('cobralCloudShadow:')===0).forEach(k=>localStorage.removeItem(k));localStorage.removeItem('cobralCloudEnabled');localStorage.removeItem(PHOTO_MAP_KEY);try{state.photoCache={};indexedDB.deleteDatabase('cobralPhotos')}catch(e){}}catch(e){console.log('Local clear error:',e)}location.reload();return}try{await CobralCloud.signOut()}catch(e){console.log('Cloud sign out error:',e)}localStorage.setItem('cobralCloudEnabled','0');state.cloudUser=null;updateHeaderCloudIcon();showBigToast('Sesión cerrada','success');openAccountModal()}
async function finishCloudLogin(silent){localStorage.setItem('cobralCloudEnabled','1');try{const localSnap=state.hadLocalData?buildCloudSnapshot():{sales:state.sales,products:state.products.filter(p=>!(state.defaultProductIds||[]).includes(p.id)),debts:state.debts,debtHistory:state.debtHistory,settings:null};const merged=await CobralCloud.firstSync(localSnap);state.sales=merged.sales||[];const sentIds=localSnap.products.map(p=>p.id);if(merged.products&&merged.products.some(p=>!sentIds.includes(p.id)))state.products=merged.products;state.debts=merged.debts||[];state.debtHistory=merged.debtHistory||[];const s=merged.settings;if(s){if('categories'in s)state.categories=s.categories;if('locations'in s)state.locations=s.locations;if('hiddenLocations'in s)state.hiddenLocations=s.hiddenLocations||[];if('userName'in s)state.userName=s.userName;if('debitFee'in s)state.debitFee=s.debitFee;if('creditFee'in s)state.creditFee=s.creditFee;if('posProvider'in s)state.posProvider=s.posProvider==='getnet'?'getnet':'haulmer'}fixDuplicateTicketNumbers();saveData();render();if(!silent){closeModal();showBigToast('Cuenta conectada','success')}}catch(e){console.log('firstSync error:',e);if(silent){showToast('No se pudo sincronizar. Cobral se abrió con tus datos locales.','error');render()}else{state.cloudAuthError='No se pudo sincronizar. Tus datos locales no cambiaron.';refreshCloudAuthUI()}}}

const IDB={db:null,
open(){return new Promise((res,rej)=>{if(IDB.db)return res(IDB.db);const r=indexedDB.open('cobralPhotos',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('photos')};r.onsuccess=e=>{IDB.db=e.target.result;res(IDB.db)};r.onerror=e=>rej(e)})},
async save(key,val){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(val,key);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})},
async get(key){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=e=>rej(e)})},
async del(key){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(key);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})},
async getAll(){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').getAll();const k=tx.objectStore('photos').getAllKeys();let vals,keys;r.onsuccess=()=>{vals=r.result};k.onsuccess=()=>{keys=k.result};tx.oncomplete=()=>{const m={};keys.forEach((key,i)=>m[key]=vals[i]);res(m)};tx.onerror=e=>rej(e)})}};

function compressPhoto(dataUrl,maxPx,quality){return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxPx||h>maxPx){const r=Math.min(maxPx/w,maxPx/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',quality))};img.src=dataUrl})}

async function loadPhotosToCache(){try{const all=await IDB.getAll();Object.keys(all).forEach(k=>{if(k==='user')state.photoCache.user=all[k];else state.photoCache[k]=all[k]});if(state.photoCache.user)state.userPhoto=state.photoCache.user}catch(e){console.log('IDB load error:',e)}}

async function migratePhotosToIDB(){let migrated=false;for(const p of state.products){if(p.image&&p.image.startsWith('data:')){await IDB.save(String(p.id),p.image);state.photoCache[String(p.id)]=p.image;p.image=null;migrated=true}}if(state.userPhoto&&state.userPhoto.startsWith('data:')&&state.userPhoto!==COBRA_AVATAR){await IDB.save('user',state.userPhoto);state.photoCache.user=state.userPhoto;migrated=true}if(migrated){saveData();console.log('Photos migrated to IndexedDB')}}

if(document.getElementById('deskKeys')){closeDeskShortcuts();return}
if(sale){e.preventDefault();minimizeSale();return}
const btn=document.querySelector('#modalContainer .modal-close');
if(btn){btn.click();return}
const ov=document.querySelector('#modalContainer .modal-overlay');
if(ov){ov.click();return}
if(typing)t.blur();
return}

if(!isNative){document.addEventListener('keydown',e=>{if(isDesk()){deskKeydown(e);return}if(e.key!=='Escape')return;if(document.getElementById('dragSheet')){minimizeSale();return}const btn=document.querySelector('#modalContainer .modal-close');if(btn)btn.click()})}

// ===== CALCULADORA GETNET (E7): comisión exacta por voucher con la UF oficial del día =====
// Tarifas del contrato Getnet, venta presencial POS, sin IVA: % del monto + cargo fijo en UF por transacción.
// bp = centésimas de % (0,63 % -> 63), ufx = diezmilésimas de UF (0,0015 UF -> 15). Enteros para no arrastrar decimales binarios.
const GETNET_TYPES=[{k:'debito',label:'Débito',bp:63,ufx:15,main:true},{k:'credito',label:'Crédito',bp:161,ufx:18,main:true},{k:'prepago',label:'Prepago',bp:109,ufx:14},{k:'extranjera',label:'Extranjera',bp:265,ufx:117}];
function getnetType(k){return GETNET_TYPES.find(t=>t.k===k)||GETNET_TYPES[0]}
// Regla de Getnet (verificada al peso contra 24 transacciones del portal): % redondeado a pesos + cargo fijo (UF x valor) redondeado + IVA 19 % redondeado.
function getnetFee(amount,k,uf){const t=getnetType(k);const pct=Math.round(amount*t.bp/10000),fixed=Math.round(t.ufx*uf/10000),iva=Math.round((pct+fixed)*19/100),fee=pct+fixed+iva;return{pct,fixed,iva,fee,abono:amount-fee}}
// UF oficial del día. Cada valor se publica antes de su fecha (el día 9, para el 10 al 9 siguiente) y no cambia después,
// así que lo descargado se guarda y sirve sin internet. Nunca se estima: sin valor publicado no hay cálculo.
const ufPad=n=>String(n).padStart(2,'0');
function ufKey(d){return d.getFullYear()+'-'+ufPad(d.getMonth()+1)+'-'+ufPad(d.getDate())}
function ufLabel(key){const p=key.split('-');return p[2]+'-'+p[1]+'-'+p[0]}
function ufFmt(v){return'$'+v.toLocaleString('es-CL',{minimumFractionDigits:2,maximumFractionDigits:2})}
function ufRead(name){try{return JSON.parse(localStorage.getItem(name)||'{}')||{}}catch(e){return{}}}
function ufWrite(name,map){try{localStorage.setItem(name,JSON.stringify(map))}catch(e){}}
async function ufFromMindicador(year){const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);try{const r=await fetch('https://mindicador.cl/api/uf/'+year,{signal:c.signal,cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),out={};(j&&j.serie||[]).forEach(p=>{const v=Number(p.valor),ms=Date.parse(p.fecha);if(v>0&&ms)out[new Date(ms+12*3600e3).toISOString().slice(0,10)]=v});return out}finally{clearTimeout(t)}}
// Respaldo solo en el APK: la tabla anual del SII (el navegador la bloquea por CORS en la versión web).
async function ufFromSII(year){const H=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.CapacitorHttp;if(!isNative||!H)throw new Error('SII no disponible');const r=await H.get({url:'https://www.sii.cl/valores_y_fechas/uf/uf'+year+'.htm',responseType:'text',connectTimeout:12000,readTimeout:12000});const html=String(r&&r.data||''),out={};const meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];meses.forEach((m,i)=>{const a=html.search(new RegExp("id=['\"]mes_"+m+"['\"]"));if(a<0)return;const rest=html.slice(a+10),b=rest.search(/id=['"]mes_/),sec=b<0?rest:rest.slice(0,b);const re=/<strong>\s*(\d{1,2})\s*<\/strong>\s*<\/th>\s*<td[^>]*>\s*([\d.]+,\d+)\s*<\/td>/g;let x;while((x=re.exec(sec))){const v=parseFloat(x[2].replace(/\./g,'').replace(',','.'));if(v>0)out[year+'-'+ufPad(i+1)+'-'+ufPad(+x[1])]=v}});return out}
// Comisión de una venta con tarjeta según la máquina elegida en Configuración (E8).
// Haulmer: % plano con IVA incluido (state.debitFee/creditFee). Getnet: fórmula del contrato con la UF oficial del día de la venta.
// Si es Getnet y no hay UF de ese día en el dispositivo, la venta queda con comisión pendiente (0) y se completa sola al llegar la UF.
function activePos(){return state.editingSaleId&&state.editingSalePos?state.editingSalePos:(state.posProvider==='getnet'?'getnet':'haulmer')}
function ufLocal(key){return ufRead('cobralUF')[key]||ufRead('cobralUFManual')[key]||null}
function saleFee(amount,method,date,pos){if(method!=='debito'&&method!=='credito')return{fee:0};pos=pos||activePos();if(pos!=='getnet')return{fee:amount*(method==='debito'?state.debitFee:state.creditFee)/100,pos:'haulmer'};const uf=ufLocal(ufKey(date?new Date(date):new Date()));if(!uf)return{fee:0,pos:'getnet',pending:true};return{fee:getnetFee(amount,method,uf).fee,pos:'getnet'}}
function posFields(t){return t&&t.pos==='getnet'?{pos:'getnet',feePending:!!t.pending}:{}}
function feeBadge(method){if(activePos()==='getnet'){const t=getnetType(method);return'Getnet '+formatPct(t.bp/100)+'% + '+formatPct(t.ufx/10000)+' UF'}return'-'+formatPct(method==='debito'?state.debitFee:state.creditFee)+'% IVA incl.'}
function setPosChoice(p){playSound('select');const i=document.getElementById('inputPos');if(i)i.value=p;document.querySelectorAll('#posSeg .seg-btn').forEach(b=>b.classList.toggle('active',b.dataset.pos===p));const h=document.getElementById('posHaulmerRows'),g=document.getElementById('posGetnetInfo');if(h)h.style.display=p==='getnet'?'none':'';if(g)g.style.display=p==='getnet'?'block':'none'}
function resolvePendingFees(){const pend=(state.sales||[]).filter(x=>x.feePending&&x.pos==='getnet');if(!pend.length)return;let changed=false;const miss=new Set();pend.forEach(x=>{const k=ufKey(new Date(x.date)),uf=ufLocal(k);if(!uf){miss.add(k);return}const f=getnetFee(x.subtotal,x.paymentMethod,uf).fee;x.fee=f;x.finalAmount=x.subtotal-f;x.margin=x.finalAmount-(x.totalCost||0);x.marginPct=x.finalAmount?(x.margin/x.finalAmount)*100:0;x.feePending=false;changed=true});if(changed){saveData();if(!saleOrEditInProgress())render()}miss.forEach(k=>getUF(k).then(r=>{if(r&&r.value)resolvePendingFees()}).catch(()=>{}))}
const ufInflight={};
function getUF(key){const c=ufRead('cobralUF');if(c[key])return Promise.resolve({value:c[key],from:'cache'});if(ufInflight[key])return ufInflight[key];
ufInflight[key]=(async()=>{const year=key.slice(0,4);let got={},reached=false,from=null;
for(const[src,fn]of[['mindicador',ufFromMindicador],['sii',ufFromSII]]){try{const r=await fn(year);reached=true;Object.assign(got,r);if(r[key]){from=src;break}}catch(e){console.log('UF '+src+':',e&&e.message)}}
if(Object.keys(got).length){const all=ufRead('cobralUF');Object.assign(all,got);ufWrite('cobralUF',all)}
if(got[key])return{value:got[key],from};
const man=ufRead('cobralUFManual')[key];if(man)return{value:man,from:'manual'};
const last=Object.keys(got).sort().pop();return{value:null,reason:!reached?'offline':(last&&key>last?'notPublished':'missing')}})().finally(()=>{delete ufInflight[key]});
return ufInflight[key]}
// Vouchers del día, solo en este dispositivo.
function gnVouchers(){return ufRead('cobralGetnetVouchers')}
function gnSaveVouchers(map){const lim=ufKey(new Date(Date.now()-180*864e5));Object.keys(map).forEach(k=>{if(k<lim||!map[k].length)delete map[k]});ufWrite('cobralGetnetVouchers',map)}
function gnAmountValue(){const el=document.getElementById('gnAmount');return el?parseInt(el.value.replace(/\D/g,''),10)||0:0}
function openGetnetCalc(){playSound('open');if(!state.gnDate)state.gnDate=ufKey(new Date());document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal gn-modal"><div class="modal-header"><h2 class="modal-title">${SVG.calc} Calculadora Getnet</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="gn-date"><button class="gn-day-btn" onclick="gnShiftDay(-1)" aria-label="Día anterior">‹</button><input type="date" class="input" id="gnDate" value="${state.gnDate}" onchange="if(this.value)gnSetDate(this.value)"><button class="gn-day-btn" onclick="gnShiftDay(1)" aria-label="Día siguiente">›</button></div><div id="gnUF" class="gn-uf"></div><label class="input-label">Monto del voucher</label><input class="input gn-amount" id="gnAmount" type="text" inputmode="numeric" autocomplete="off" placeholder="$0" oninput="gnAmountInput(this)"><div class="gn-types" id="gnTypes"></div><div id="gnSummary"></div><div id="gnList"></div><div class="gn-note">Tarifas del contrato Getnet (venta presencial POS): débito 0,63 % + 0,0015 UF · crédito 1,61 % + 0,0018 UF · prepago 1,09 % + 0,0014 UF · extranjera 2,65 % + 0,0117 UF, más IVA, por transacción. No incluye el cargo mensual del POS (0,25 UF + IVA, después de los 3 meses sin cobro).</div></div><div class="modal-footer"><button class="btn btn-outline" onclick="gnClearDay()">Borrar día</button><button class="btn btn-primary" onclick="closeModal()">Listo</button></div></div></div>`;gnLoadUF()}
function gnSetDate(key){state.gnDate=key;state.gnClearArmed=false;const el=document.getElementById('gnDate');if(el&&el.value!==key)el.value=key;gnLoadUF()}
function gnShiftDay(n){const p=state.gnDate.split('-').map(Number);playSound('select');gnSetDate(ufKey(new Date(p[0],p[1]-1,p[2]+n)))}
function gnLoadUF(){const key=state.gnDate;state.gnUF={status:'loading'};gnRender();getUF(key).then(r=>{if(state.gnDate!==key)return;state.gnUF=r.value?{status:'ok',value:r.value,from:r.from}:{status:'error',reason:r.reason};gnRender()})}
function gnAmountInput(el){const d=el.value.replace(/\D/g,'').slice(0,9);el.value=d?'$'+Number(d).toLocaleString('es-CL'):'';gnRenderTypes()}
function gnAdd(k){const amount=gnAmountValue();if(!amount){showToast('Ingresa el monto del voucher','error');document.getElementById('gnAmount').focus();return}const map=gnVouchers();(map[state.gnDate]=map[state.gnDate]||[]).push({id:Date.now(),amount,type:k});gnSaveVouchers(map);playSound('add');const el=document.getElementById('gnAmount');el.value='';state.gnClearArmed=false;gnRender();el.focus()}
function gnDel(id){const map=gnVouchers();map[state.gnDate]=(map[state.gnDate]||[]).filter(v=>v.id!==id);gnSaveVouchers(map);playSound('remove');gnRender()}
function gnClearDay(){const list=gnVouchers()[state.gnDate]||[];if(!list.length)return;if(!state.gnClearArmed){state.gnClearArmed=true;showToast('Toca otra vez «Borrar día» para borrar '+list.length+' voucher'+(list.length===1?'':'s'),'info');setTimeout(()=>{state.gnClearArmed=false},3000);return}state.gnClearArmed=false;const map=gnVouchers();delete map[state.gnDate];gnSaveVouchers(map);playSound('remove');gnRender()}
function gnSaveManualUF(){const el=document.getElementById('gnUFManual');const v=parseFloat(String(el&&el.value||'').replace(/\./g,'').replace(',','.'));if(!(v>10000&&v<1000000)){showToast('Escribe la UF tal como sale en el SII, por ejemplo 41.098,15','error');return}const m=ufRead('cobralUFManual');m[state.gnDate]=v;ufWrite('cobralUFManual',m);state.gnUF={status:'ok',value:v,from:'manual'};playSound('save');gnRender();resolvePendingFees()}
function gnRender(){if(!document.getElementById('gnUF'))return;const u=state.gnUF||{status:'loading'},key=state.gnDate,box=document.getElementById('gnUF');box.classList.toggle('gn-err',u.status==='error');
if(u.status==='loading')box.innerHTML=`<div class="gn-uf-sub" style="margin:0">Buscando la UF oficial del ${ufLabel(key)}…</div>`;
else if(u.status==='ok'){const src={mindicador:'Valor oficial (Banco Central, vía mindicador.cl)',sii:'Valor oficial (SII)',cache:'Valor oficial guardado en este dispositivo',manual:'Ingresada a mano'}[u.from]||'';box.innerHTML=`<div class="gn-uf-top"><span style="font-weight:600">UF del ${ufLabel(key)}</span><span class="gn-uf-val">${ufFmt(u.value)}</span></div><div class="gn-uf-sub">${src}</div>`+(u.from==='manual'?`<div class="gn-uf-actions"><button class="btn btn-sm btn-outline" onclick="gnLoadUF()">Buscar valor oficial</button></div>`:'')}
else{const msg=u.reason==='notPublished'?`La UF del ${ufLabel(key)} aún no está publicada. El Banco Central la publica el día 9 de cada mes (para el 10 al 9 del mes siguiente).`:u.reason==='offline'?`No se pudo obtener la UF del ${ufLabel(key)}: sin conexión a internet.`:`No se encontró la UF del ${ufLabel(key)}.`;box.innerHTML=`<div style="font-weight:600">Sin UF del día</div><div class="gn-uf-sub">${msg} Sin la UF no se calcula la comisión (no se usan valores aproximados).</div><div class="gn-uf-actions"><button class="btn btn-sm btn-outline" onclick="gnLoadUF()">Reintentar</button><input class="input" id="gnUFManual" inputmode="decimal" placeholder="UF del SII, ej. 41.098,15"><button class="btn btn-sm btn-primary" onclick="gnSaveManualUF()">Usar</button></div>`}
gnRenderTypes();
const uf=u.status==='ok'?u.value:null,list=(gnVouchers()[key]||[]);let tot={amount:0,pct:0,fixed:0,iva:0,fee:0,abono:0};const counts={};
const rows=list.map((v,i)=>{const t=getnetType(v.type);counts[t.label]=(counts[t.label]||0)+1;tot.amount+=v.amount;let sub='Comisión — · falta la UF';if(uf){const f=getnetFee(v.amount,v.type,uf);['pct','fixed','iva','fee','abono'].forEach(x=>tot[x]+=f[x]);sub=`Comisión -${formatMoney(f.fee)} · Abono ${formatMoney(f.abono)}`}return`<div class="gn-row"><div class="gn-row-main"><div class="gn-row-top"><span>#${i+1} · ${t.label}</span><span>${formatMoney(v.amount)}</span></div><div class="gn-row-sub">${sub}</div></div><button class="gn-del" onclick="gnDel(${v.id})" aria-label="Quitar voucher">×</button></div>`}).reverse().join('');
document.getElementById('gnList').innerHTML=list.length?`<div class="gn-list-title">Vouchers del ${ufLabel(key)} (${list.length})</div>${rows}`:`<div class="gn-note" style="text-align:center;margin:8px 0 0">Escribe el monto de cada voucher y toca el tipo de tarjeta.</div>`;
const det=Object.keys(counts).map(k=>counts[k]+' '+k.toLowerCase()).join(' · ');
document.getElementById('gnSummary').innerHTML=list.length?`<div class="summary-box" style="margin:0 0 12px"><div class="summary-row"><span>Ventas (${det})</span><span>${formatMoney(tot.amount)}</span></div>`+(uf?`<div class="summary-row"><span>Comisión (IVA incluido)</span><span class="discount">-${formatMoney(tot.fee)}</span></div><div class="summary-row" style="font-size:12px;opacity:.75"><span>% ${formatMoney(tot.pct)} · cargo fijo ${formatMoney(tot.fixed)} · IVA ${formatMoney(tot.iva)}</span><span>${(tot.fee/tot.amount*100).toFixed(2).replace('.',',')} %</span></div><div class="summary-row total"><span>Te abonan</span><span>${formatMoney(tot.abono)}</span></div>`:`<div class="summary-row"><span>Comisión</span><span>falta la UF del día</span></div>`)+`</div>`:''}
function gnRenderTypes(){const el=document.getElementById('gnTypes');if(!el)return;const amount=gnAmountValue(),u=state.gnUF;const uf=u&&u.status==='ok'?u.value:null;if(!el.children.length)el.innerHTML=GETNET_TYPES.map(t=>`<button class="gn-type${t.main?' gn-main':''}" onclick="gnAdd('${t.k}')"><b>${t.label}</b><small></small></button>`).join('');GETNET_TYPES.forEach((t,i)=>{let sub='\u00a0';if(amount&&uf){const f=getnetFee(amount,t.k,uf);sub=`-${formatMoney(f.fee)} → ${formatMoney(f.abono)}`}el.children[i].querySelector('small').textContent=sub})}
// Precarga: al abrir la app o volver a ella, si falta la UF de hoy se busca siempre; si faltan los próximos 3 días se reintenta
// como máximo cada 6 h. Así el día 9, apenas se publica el período 10→9, queda guardado y el día 10 funciona sin conexión.
function ufPrefetch(){resolvePendingFees();const c=ufRead('cobralUF'),today=ufKey(new Date()),ahead=ufKey(new Date(Date.now()+3*864e5));if(!c[today]){getUF(today).catch(()=>{});return}if(c[ahead])return;let last=0;try{last=+localStorage.getItem('cobralUFTry')||0}catch(e){}if(Date.now()-last<6*3600e3)return;try{localStorage.setItem('cobralUFTry',String(Date.now()))}catch(e){}getUF(ahead).catch(()=>{})}
setTimeout(ufPrefetch,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(ufPrefetch,2000)});
init();
let _lastDay=new Date().toDateString();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const now=new Date();const today=now.toDateString();if(today!==_lastDay){_lastDay=today;const oldLoc=state.currentLocation;state.currentLocation=state.locations[now.getDay()]||'Sin definir';migrateCartPricesForLocationChange(oldLoc,state.currentLocation);state.selectedDate=now;state.homeSelectedDate=now;state.selectedWeekStart=getWeekStart(now);state.homeSelectedWeekStart=getWeekStart(now);state.selectedMonth=now.getMonth();state.homeSelectedMonth=now.getMonth();state.selectedYear=now.getFullYear();state.homeSelectedYear=now.getFullYear();render()}});
</script>

if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(regs=>regs.forEach(r=>r.unregister())).catch(e=>{console.log('SW unregister error:',e)})}
}else if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js').then(r=>{console.log('SW registrado:',r.scope)}).catch(e=>{console.log('SW no disponible:',e)})}
