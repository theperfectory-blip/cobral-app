}else{
body.innerHTML=`<div class="input-group"><label class="input-label">Correo</label><input class="input" id="cloudEmailInput" type="email" autocomplete="email" placeholder="tu@correo.com"></div><div class="input-group"><label class="input-label">Contraseña</label><input class="input" id="cloudPassInput" type="password" autocomplete="current-password" placeholder="••••••••"></div>${state.cloudAuthError?`<div style="color:var(--danger);margin-bottom:10px;font-size:13px">${state.cloudAuthError}</div>`:''}<div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn btn-primary" id="cloudSignInBtn" style="flex:1" ${state.cloudAuthBusy?'disabled':''} onclick="cloudSignIn()">Entrar</button><button class="btn btn-outline" id="cloudSignUpBtn" style="flex:1" ${state.cloudAuthBusy?'disabled':''} onclick="cloudSignUp()">Crear cuenta</button></div><div style="text-align:center;margin-bottom:16px"><a href="#" id="cloudResetLink" class="cloud-link" onclick="event.preventDefault();cloudResetPassword()">¿Olvidaste tu contraseña?</a></div><p style="font-size:12px;color:var(--gray-500);text-align:center;line-height:1.5">Tu cuenta sincroniza ventas, inventario y deudas entre tu celular y la versión web. Sin cuenta, Cobral sigue funcionando igual en este teléfono.</p>`;
}}
function confirmCloudSignOut(){document.getElementById('modalContainer').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)openAccountModal()"><div class="modal"><div class="modal-header"><h2 class="modal-title">${SVG.settings} Cerrar sesión</h2><button class="modal-close" onclick="openAccountModal()">×</button></div><div class="modal-body"><p style="text-align:center;margin-bottom:8px">¿Cerrar sesión de <strong>${state.cloudUser?state.cloudUser.email:''}</strong>?</p><p style="font-size:13px;color:var(--gray-500);text-align:center">Tus datos quedan guardados en este teléfono.</p></div><div class="modal-footer"><button class="btn btn-outline" onclick="playSound('back');openAccountModal()">Cancelar</button><button class="btn btn-danger" id="cloudSignOutConfirmBtn" onclick="cloudSignOut()">Cerrar sesión</button></div></div></div>`}
function refreshCloudAuthUI(){if(document.getElementById('accountModalBody'))renderAccountModal();else if(!isNative)renderLoginGate()}
async function cloudSignIn(){const email=(document.getElementById('cloudEmailInput').value||'').trim();const pass=document.getElementById('cloudPassInput').value||'';if(!email||!pass){state.cloudAuthError='Ingresa correo y contraseña';return refreshCloudAuthUI()}state.cloudAuthBusy=true;state.cloudAuthError='';refreshCloudAuthUI();const r=await CobralCloud.signIn(email,pass);state.cloudAuthBusy=false;if(!r.ok){state.cloudAuthError=r.message;return refreshCloudAuthUI()}await finishCloudLogin()}
async function cloudSignUp(){const email=(document.getElementById('cloudEmailInput').value||'').trim();const pass=document.getElementById('cloudPassInput').value||'';if(!email||!pass){state.cloudAuthError='Ingresa correo y contraseña';return refreshCloudAuthUI()}state.cloudAuthBusy=true;state.cloudAuthError='';refreshCloudAuthUI();const r=await CobralCloud.signUp(email,pass);state.cloudAuthBusy=false;if(!r.ok){state.cloudAuthError=r.message;return refreshCloudAuthUI()}await finishCloudLogin()}
async function cloudResetPassword(){const email=(document.getElementById('cloudEmailInput').value||'').trim();if(!email){state.cloudAuthError='Ingresa tu correo para recuperar la contraseña';return refreshCloudAuthUI()}state.cloudAuthBusy=true;refreshCloudAuthUI();const r=await CobralCloud.resetPassword(email);state.cloudAuthBusy=false;state.cloudAuthError=r.ok?'':r.message;if(r.ok)showToast('Te enviamos un correo para recuperar tu contraseña','success');refreshCloudAuthUI()}
async function cloudSignOut(){if(!isNative){try{await CobralCloud.signOut({clearCache:true})}catch(e){console.log('Cloud sign out error:',e)}try{localStorage.removeItem('ventasApp');Object.keys(localStorage).filter(k=>k.indexOf('cobralCloudShadow:')===0).forEach(k=>localStorage.removeItem(k));localStorage.removeItem('cobralCloudEnabled');try{state.photoCache={};indexedDB.deleteDatabase('cobralPhotos')}catch(e){}}catch(e){console.log('Local clear error:',e)}location.reload();return}try{await CobralCloud.signOut()}catch(e){console.log('Cloud sign out error:',e)}localStorage.setItem('cobralCloudEnabled','0');state.cloudUser=null;updateHeaderCloudIcon();showBigToast('Sesión cerrada','success');openAccountModal()}
async function finishCloudLogin(silent){localStorage.setItem('cobralCloudEnabled','1');try{const localSnap=state.hadLocalData?buildCloudSnapshot():{sales:[],products:[],debts:[],debtHistory:[],settings:null};const merged=await CobralCloud.firstSync(localSnap);state.sales=merged.sales||[];if(merged.products&&merged.products.length)state.products=merged.products;state.debts=merged.debts||[];state.debtHistory=merged.debtHistory||[];const s=merged.settings;if(s){if('categories'in s)state.categories=s.categories;if('locations'in s)state.locations=s.locations;if('userName'in s)state.userName=s.userName;if('debitFee'in s)state.debitFee=s.debitFee;if('creditFee'in s)state.creditFee=s.creditFee}fixDuplicateTicketNumbers();saveData();render();if(!silent){closeModal();showBigToast('Cuenta conectada','success')}}catch(e){console.log('firstSync error:',e);if(silent){showToast('No se pudo sincronizar. Cobral se abrió con tus datos locales.','error');render()}else{state.cloudAuthError='No se pudo sincronizar. Tus datos locales no cambiaron.';refreshCloudAuthUI()}}}
function renderBootLoading(){const el=document.getElementById('authGate');if(!el)return;el.innerHTML=`<div class="auth-gate-overlay"><div class="auth-gate-box auth-gate-loading"><div class="auth-gate-avatar"><img src="${COBRA_AVATAR}"></div><div class="auth-gate-spinner"></div></div></div>`}
function renderLoginGate(){const el=document.getElementById('authGate');if(!el)return;el.innerHTML=`<div class="auth-gate-overlay"><div class="auth-gate-box"><div class="auth-gate-avatar"><img src="${COBRA_AVATAR}"></div><div class="auth-gate-title">Cobral</div><div class="auth-gate-subtitle">Inicia sesión para continuar</div><form id="loginGateForm" onsubmit="event.preventDefault();cloudSignIn();return false"><div class="input-group"><label class="input-label">Correo</label><input class="input" id="cloudEmailInput" type="email" autocomplete="email" placeholder="tu@correo.com"></div><div class="input-group"><label class="input-label">Contraseña</label><input class="input" id="cloudPassInput" type="password" autocomplete="current-password" placeholder="••••••••"></div>${state.cloudAuthError?`<div style="color:var(--danger);margin-bottom:10px;font-size:13px;text-align:center">${state.cloudAuthError}</div>`:''}<div style="display:flex;gap:8px;margin-bottom:8px"><button type="submit" class="btn btn-primary" id="cloudSignInBtn" style="flex:1" ${state.cloudAuthBusy?'disabled':''}>Entrar</button><button type="button" class="btn btn-outline" id="cloudSignUpBtn" style="flex:1" ${state.cloudAuthBusy?'disabled':''} onclick="cloudSignUp()">Crear cuenta</button></div><div style="text-align:center"><a href="#" id="cloudResetLink" class="cloud-link" onclick="event.preventDefault();cloudResetPassword()">¿Olvidaste tu contraseña?</a></div></form></div></div>`}

const IDB={db:null,
open(){return new Promise((res,rej)=>{if(IDB.db)return res(IDB.db);const r=indexedDB.open('cobralPhotos',1);r.onupgradeneeded=e=>{e.target.result.createObjectStore('photos')};r.onsuccess=e=>{IDB.db=e.target.result;res(IDB.db)};r.onerror=e=>rej(e)})},
async save(key,val){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(val,key);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})},
async get(key){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').get(key);r.onsuccess=()=>res(r.result||null);r.onerror=e=>rej(e)})},
async del(key){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(key);tx.oncomplete=()=>res();tx.onerror=e=>rej(e)})},
async getAll(){const db=await IDB.open();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').getAll();const k=tx.objectStore('photos').getAllKeys();let vals,keys;r.onsuccess=()=>{vals=r.result};k.onsuccess=()=>{keys=k.result};tx.oncomplete=()=>{const m={};keys.forEach((key,i)=>m[key]=vals[i]);res(m)};tx.onerror=e=>rej(e)})}};

function compressPhoto(dataUrl,maxPx,quality){return new Promise(res=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxPx||h>maxPx){const r=Math.min(maxPx/w,maxPx/h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',quality))};img.src=dataUrl})}

async function loadPhotosToCache(){try{const all=await IDB.getAll();Object.keys(all).forEach(k=>{if(k==='user')state.photoCache.user=all[k];else state.photoCache[k]=all[k]});if(state.photoCache.user)state.userPhoto=state.photoCache.user}catch(e){console.log('IDB load error:',e)}}

async function migratePhotosToIDB(){let migrated=false;for(const p of state.products){if(p.image&&p.image.startsWith('data:')){await IDB.save(String(p.id),p.image);state.photoCache[String(p.id)]=p.image;p.image=null;migrated=true}}if(state.userPhoto&&state.userPhoto.startsWith('data:')&&state.userPhoto!==COBRA_AVATAR){await IDB.save('user',state.userPhoto);state.photoCache.user=state.userPhoto;migrated=true}if(migrated){saveData();console.log('Photos migrated to IndexedDB')}}
if(!isNative){document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(document.getElementById('dragSheet')){minimizeSale();return}const btn=document.querySelector('#modalContainer .modal-close');if(btn)btn.click()})}
init();
let _lastDay=new Date().toDateString();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const now=new Date();const today=now.toDateString();if(today!==_lastDay){_lastDay=today;state.currentLocation=state.locations[now.getDay()]||'Sin definir';state.selectedDate=now;state.homeSelectedDate=now;state.selectedWeekStart=getWeekStart(now);state.homeSelectedWeekStart=getWeekStart(now);state.selectedMonth=now.getMonth();state.homeSelectedMonth=now.getMonth();state.selectedYear=now.getFullYear();state.homeSelectedYear=now.getFullYear();render()}});
</script>
